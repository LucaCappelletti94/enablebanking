name: Sandbox

on:
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sandbox:
    if: github.repository == 'LucaCappelletti94/enablebanking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Approves Nordea FI sandbox consents in the runner's headless Chrome.
      - name: Call every endpoint against the sandbox
        env:
          ENABLEBANKING_SANDBOX_APP: ${{ secrets.ENABLEBANKING_SANDBOX_APP }}
          ENABLEBANKING_SANDBOX_KEY: ${{ secrets.ENABLEBANKING_SANDBOX_KEY }}
        run: cargo run --locked --example sandbox
