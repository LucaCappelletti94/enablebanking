name: Mutants

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants in the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...HEAD" > pr.diff
          cargo mutants --workspace --in-diff pr.diff --jobs 2
      - name: Every mutant
        if: github.event_name != 'pull_request'
        run: cargo mutants --workspace --jobs 2
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: mutants.out
