name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LucaCappelletti94/enablebanking' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check the release version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "enablebanking") | .version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
      - name: Check crates.io publication
        id: registry
        run: |
          status=$(curl --silent --show-error --location --max-time 30 \
            --user-agent "enablebanking-release ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            --output "$RUNNER_TEMP/crate-version.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/enablebanking/${RELEASE_TAG#v}")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io lookup failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Verify the package
        if: steps.registry.outputs.published == 'false'
        run: cargo publish -p enablebanking --locked --dry-run
      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p enablebanking --locked
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/github-release.json" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$status" in
            200) echo "GitHub release $RELEASE_TAG already exists" ;;
            404) gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes "https://crates.io/crates/enablebanking/${RELEASE_TAG#v}" ;;
            *) echo "GitHub release lookup failed with HTTP $status" >&2; exit 1 ;;
          esac
